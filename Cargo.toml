[package]
name = "css-bitvector-compiler"
version = "0.0.1"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "CSS Compiler with HTML/CSS parsing capabilities"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[lib]
name = "css_bitvector_compiler"
path = "src/lib.rs"

[dependencies]
lightningcss = "1.0.0-alpha.68"
parcel_selectors = "0.28.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
